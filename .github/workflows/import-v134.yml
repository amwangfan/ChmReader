name: Import RuleDesk v1.3.4 source

on:
  push:
    branches: [main]
    paths:
      - '.import/v1.3.4.zip'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand release source
        shell: bash
        run: |
          set -euo pipefail
          unzip -o .import/v1.3.4.zip -d .
          rm -rf .import
          rm -f .github/workflows/import-v134.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import RuleDesk v1.3.4 source"
          git push
